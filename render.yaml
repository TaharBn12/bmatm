# =========================================================
# WatchTogether على Render — مخطط النشر (Blueprint)
# ---------------------------------------------------------
# Render يقرأ هذا الملف تلقائياً عند اختيار:
#   New  ›  Blueprint  ›  (اختر مستودع TaharBn12/bmatm)
# فلا تحتاج إلى إعداد أي شيء يدوياً.
#
# ملاحظات الخطة المجانية (free):
#   • تنام الخدمة بعد 15 دقيقة بلا طلبات، وأول طلب بعدها يستغرق ~50 ثانية.
#   • القرص مؤقت: تُحذف data/rooms.json (الغرف) عند كل إعادة تشغيل.
#   • الويب سوكيت مدعوم، والرابط آمن HTTPS دائماً.
# =========================================================
services:
  - type: web
    name: watchtogether
    runtime: docker          # Render لا يشغّل Java أصلياً — نستخدم صورتنا
    plan: free               # غيّرها إلى starter إن أردت تشغيلاً دائماً
    region: frankfurt        # أقرب منطقة للجزائر
    branch: main
    autoDeploy: true         # كل دمج في main ينشر تلقائياً
    healthCheckPath: /healthz
    envVars:
      # «وضع API فقط»: السيرفر للبحث وتحويل الروابط، والموقع على GitHub Pages.
      # لإعادة «الموقع + API» على Render اجعلها false.
      - key: WT_API_ONLY
        value: "true"
      # Public project config used to validate bearer tokens for account-level Java presence.
      - key: WT_SUPABASE_URL
        value: https://cazwkhcbkzhnsluuafwz.supabase.co
      - key: WT_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhendraGNia3pobnNsdXVhZnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc5NDQ3ODIsImV4cCI6MjA4MzUyMDc4Mn0.u1l9BrzI7ZA9P3CSdXN0tYkHu1TUNTGsqczByNSPUN0
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: ROOT
        value: /app/watch_together
      - key: WT_PYTHON
        value: python3
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUTF8
        value: "1"
      - key: TZ
        value: Africa/Algiers
      # الموقع على استضافة ثابتة (GitHub Pages) والسيرفر هنا؟
      # اكتب نطاق موقعك للسماح بالطلبات عبر النطاقين (CORS)، أو '*' للتجربة:
      - key: WT_ALLOWED_ORIGINS
        sync: false
      # لحفظ الغرف على قرص دائم (خطة مدفوعة): أضف Disk بمسار /var/data ثم فعّل:
      # - key: JAVA_TOOL_OPTIONS
      #   value: -Dwt.data=/var/data
