name: probe-api
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: probe CORS end-to-end
        run: |
          {
            echo "=== $(date -u +%FT%TZ) ==="
            B=https://watchtogether-8vr3.onrender.com
            O=https://taharbn12.github.io
            echo; echo "===== GET /healthz (بلا Origin) ====="
            curl -sS -i --max-time 120 $B/healthz | head -20
            echo; echo "===== GET /healthz مع Origin: $O ====="
            curl -sS -i --max-time 120 -H "Origin: $O" $B/healthz | head -20
            echo; echo "===== GET /api/search مع Origin (CORS الحقيقي) ====="
            curl -sS -i --max-time 180 -H "Origin: $O" -H "Accept: application/json" \
                 "$B/api/search?q=test&limit=2&site=youtube" | head -40
            echo; echo "===== OPTIONS /api/resolve (preflight) ====="
            curl -sS -i --max-time 120 -X OPTIONS -H "Origin: $O" \
                 -H "Access-Control-Request-Method: POST" \
                 -H "Access-Control-Request-Headers: content-type" $B/api/resolve | head -20
            echo; echo "===== POST /api/resolve (يوتيوب حقيقي) ====="
            curl -sS -i --max-time 180 -X POST -H "Origin: $O" -H "Content-Type: application/json" \
                 -d '{"url":"https://www.youtube.com/watch?v=5O-vCJW1b8g"}' $B/api/resolve | head -12
            echo; echo "===== POST /api/resolve (ديليموشن حقيقي) ====="
            curl -sS -i --max-time 180 -X POST -H "Origin: $O" -H "Content-Type: application/json" \
                 -d '{"url":"https://www.dailymotion.com/video/x90lnae"}' $B/api/resolve | head -12
            echo; echo "===== POST /api/suggest ====="
            curl -sS -i --max-time 180 -X POST -H "Origin: $O" -H "Content-Type: application/json" \
                 -d '{"url":"https://www.youtube.com/watch?v=5O-vCJW1b8g","limit":3}' $B/api/suggest | head -12
            echo; echo "===== GET / (التأكد من وضع API فقط) ====="
            curl -sS -i --max-time 120 $B/ | head -15
          } > probe-output.txt 2>&1
          cat probe-output.txt
      - name: commit output
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add probe-output.txt
          git commit -m "probe output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
