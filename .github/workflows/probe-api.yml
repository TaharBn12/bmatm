name: probe-api
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: probe dailymotion resolve with a real id
        run: |
          {
            echo "=== $(date -u +%FT%TZ) ==="
            B=https://watchtogether-8vr3.onrender.com
            O=https://taharbn12.github.io
            echo; echo "===== GET /api/stats ====="
            curl -sS --max-time 120 $B/api/stats | head -40
            echo; echo "===== search dailymotion (للحصول على معرّف حقيقي) ====="
            curl -sS --max-time 180 -H "Origin: $O" -H "Accept: application/json" \
                 "$B/api/search?q=football&limit=3&site=dailymotion" -o dm.json
            head -c 900 dm.json; echo
            URL=$(python3 -c "
            import json
            d=json.load(open('dm.json'))
            for it in d.get('items',[]):
                u=it.get('url') or ''
                if 'dailymotion.com/video/' in u or 'dai.ly/' in u:
                    print(u); break
            ")
            echo "الرابط المختار: $URL"
            echo; echo "===== POST /api/resolve لهذا الرابط ====="
            if [ -n "$URL" ]; then
              python3 -c "
            import json,sys
            print(json.dumps({'url': sys.argv[1]}))" "$URL" > body.json
              curl -sS -i --max-time 180 -X POST -H "Origin: $O" -H "Content-Type: application/json" \
                   --data @body.json $B/api/resolve | head -12
            fi
          } > probe-output.txt 2>&1
          cat probe-output.txt
      - name: commit output
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git add probe-output.txt
          git commit -m "probe output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"
