<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>نقاط بيع الحليب والخبز - الجزائر العاصمة</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      direction: rtl;
    }

    #topBar {
      background-color: #4CAF50;
      padding: 10px;
      text-align: left;
    }

    #topBar button {
      padding: 10px;
      font-size: 16px;
      background-color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #map {
      height: calc(100vh - 50px);
      width: 100%;
    }

    .hidden {
      display: none;
    }

    #login, #adminPanel {
      position: absolute;
      top: 60px;
      left: 10px;
      background: white;
      border: 1px solid #ccc;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      padding: 10px;
      width: 80%;
      margin: 10px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="topBar">
    <button onclick="showLogin()">دخول المورد</button>
  </div>

  <div id="mapView">
    <div id="map"></div>
  </div>

  <div id="login" class="hidden">
    <input type="password" id="password" placeholder="كلمة السر">
    <button onclick="checkPassword()">تأكيد</button>
    <button onclick="hideLogin()">رجوع</button>
  </div>

  <div id="adminPanel" class="hidden">
    <h2>لوحة المورد</h2>
    <div id="adminList"></div>
    <button onclick="hideAdmin()">رجوع</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const PASSWORD = "1234";

    const salePoints = [
      { name: "ساحة الشهداء - حليب", lat: 36.7763, lng: 3.0581, milk: 80, bread: 0 },
      { name: "ساحة الشهداء - خبز", lat: 36.7765, lng: 3.0583, milk: 0, bread: 60 },
      { name: "ديدوش مراد - حليب", lat: 36.7689, lng: 3.0574, milk: 90, bread: 0 },
      { name: "ديدوش مراد - خبز", lat: 36.7691, lng: 3.0576, milk: 0, bread: 70 },
      { name: "باب الزوار - حليب", lat: 36.7132, lng: 3.1926, milk: 100, bread: 0 },
      { name: "باب الزوار - خبز", lat: 36.7134, lng: 3.1928, milk: 0, bread: 65 },
      { name: "القبة - حليب", lat: 36.7354, lng: 3.0968, milk: 75, bread: 0 },
      { name: "القبة - خبز", lat: 36.7356, lng: 3.0970, milk: 0, bread: 55 },
      { name: "الرويبة - حليب", lat: 36.7381, lng: 3.2835, milk: 80, bread: 0 },
      { name: "الرويبة - خبز", lat: 36.7383, lng: 3.2837, milk: 0, bread: 62 },
      { name: "بئر مراد رايس - حليب", lat: 36.7417, lng: 3.0483, milk: 70, bread: 0 },
      { name: "بئر مراد رايس - خبز", lat: 36.7419, lng: 3.0485, milk: 0, bread: 58 },
      { name: "حسين داي - حليب", lat: 36.7411, lng: 3.0870, milk: 85, bread: 0 },
      { name: "حسين داي - خبز", lat: 36.7413, lng: 3.0872, milk: 0, bread: 67 },
      { name: "باب الوادي - حليب", lat: 36.7978, lng: 3.0512, milk: 90, bread: 0 },
      { name: "باب الوادي - خبز", lat: 36.7980, lng: 3.0514, milk: 0, bread: 50 },
      { name: "الشراقة - حليب", lat: 36.7594, lng: 2.9594, milk: 100, bread: 0 },
      { name: "الشراقة - خبز", lat: 36.7596, lng: 2.9596, milk: 0, bread: 70 },
      { name: "بن عكنون - حليب", lat: 36.7480, lng: 3.0023, milk: 90, bread: 0 },
      { name: "بن عكنون - خبز", lat: 36.7482, lng: 3.0025, milk: 0, bread: 55 },
      { name: "باش جراح - حليب", lat: 36.7219, lng: 3.1236, milk: 75, bread: 0 },
      { name: "باش جراح - خبز", lat: 36.7221, lng: 3.1238, milk: 0, bread: 60 },
      { name: "المدنية - حليب", lat: 36.7415, lng: 3.0844, milk: 80, bread: 0 },
      { name: "المدنية - خبز", lat: 36.7417, lng: 3.0846, milk: 0, bread: 65 },
      { name: "المرادية - حليب", lat: 36.7505, lng: 3.0503, milk: 95, bread: 0 },
      { name: "المرادية - خبز", lat: 36.7507, lng: 3.0505, milk: 0, bread: 60 }
    ];

    let map;
    let markers = [];

    window.onload = () => {
      map = L.map('map').setView([36.75, 3.05], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
      }).addTo(map);
      updateMarkers();
    };

    function updateMarkers() {
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];

      salePoints.forEach(point => {
        const available = (point.milk > 0 || point.bread > 0);
        const color = available ? 'green' : 'red';
        const status = available ? "متوفر" : "غير متوفر";

        const marker = L.circleMarker([point.lat, point.lng], {
          radius: 8,
          color: color,
          fillColor: color,
          fillOpacity: 0.8
        }).addTo(map);

        let popupContent = `<b>${point.name}</b><br>`;
        if (point.name.includes("حليب")) {
          popupContent += `حليب: ${point.milk}<br>`;
        } else if (point.name.includes("خبز")) {
          popupContent += `خبز: ${point.bread}<br>`;
        }
        popupContent += `الحالة: ${status}`;

        marker.bindPopup(popupContent);
        markers.push(marker);
      });
    }

    function showLogin() {
      document.getElementById("login").classList.remove("hidden");
    }

    function hideLogin() {
      document.getElementById("login").classList.add("hidden");
    }

    function checkPassword() {
      const entered = document.getElementById("password").value;
      if (entered === PASSWORD) {
        hideLogin();
        showAdminPanel();
      } else {
        alert("كلمة السر خاطئة!");
      }
    }

    function showAdminPanel() {
      const container = document.getElementById("adminList");
      container.innerHTML = '';
      salePoints.forEach((point, i) => {
        container.innerHTML += `
          <div style="margin-bottom: 20px;">
            <strong>${point.name}</strong><br>
            ${point.name.includes("حليب") ? `حليب: <input type="number" value="${point.milk}" onchange="updateMilk(${i}, this.value)">` : ''}
            ${point.name.includes("خبز") ? `خبز: <input type="number" value="${point.bread}" onchange="updateBread(${i}, this.value)">` : ''}
          </div>
        `;
      });
      document.getElementById("adminPanel").classList.remove("hidden");
    }

    function hideAdmin() {
      document.getElementById("adminPanel").classList.add("hidden");
    }

    function updateMilk(i, val) {
      salePoints[i].milk = parseInt(val);
      updateMarkers();
    }

    function updateBread(i, val) {
      salePoints[i].bread = parseInt(val);
      updateMarkers();
    }
  </script>
</body>
</html>
