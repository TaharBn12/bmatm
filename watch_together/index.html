<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#06070f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>الغرف — WatchTogether</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%237c5cff'/%3E%3Cpath d='M40 32l28 18-28 18z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css?v=3.0.0">
  <link rel="stylesheet" href="assets/css/home.css?v=3.0.0">
</head>
<body class="home-page">
  <header class="home-nav">
    <a class="brand" href="index.html" aria-label="الرئيسية">
      <span class="brand__logo"><span class="ic" data-icon="logo" data-size="24"></span></span>
      <span class="brand__name">WatchTogether</span>
    </a>
    <div id="navAuth"></div>
  </header>

  <main class="home-main">
    <div class="home-heading">
      <h1>الغرف <span id="roomsCount" class="home-count">0</span></h1>
      <button class="btn btn--ghost btn--icon-sm" id="refreshRooms" type="button" aria-label="تحديث الغرف" title="تحديث الغرف">
        <span class="ic" data-icon="sync" data-size="18"></span>
      </button>
    </div>
    <p class="home-status" id="homeStatus" role="status" hidden></p>
    <div class="room-grid" id="roomsList" aria-label="الغرف" aria-busy="true"></div>
    <div class="home-empty" id="roomsEmpty" role="status">
      <span class="ic" data-icon="film" data-size="34"></span>
      <span id="roomsEmptyText">جارٍ التحميل…</span>
    </div>
  </main>

  <section class="create-panel glass" id="creator" role="dialog" aria-labelledby="createHeading" hidden>
    <h2 id="createHeading">إضافة غرفة</h2>
    <form id="createForm" autocomplete="off" novalidate>
      <div>
        <label class="label" for="roomTitle">اسم الغرفة</label>
        <input class="input" id="roomTitle" type="text" maxlength="40" required>
      </div>
      <div>
        <label class="label" for="videoUrl">رابط الفيديو <span class="label__opt">(اختياري)</span></label>
        <input class="input input--ltr" id="videoUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://…">
      </div>
      <p class="form-error" id="createError" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit" id="createBtn">
        <span class="ic" data-icon="plus" data-size="18"></span> إضافة الغرفة
      </button>
    </form>
  </section>

  <button class="home-fab" id="createToggle" type="button" aria-label="إضافة غرفة" title="إضافة غرفة" aria-haspopup="dialog" aria-controls="creator" aria-expanded="false">
    <span id="createToggleIcon"><span class="ic" data-icon="plus" data-size="26"></span></span>
  </button>

  <script src="assets/js/config.js?v=3.0.0"></script>
  <script src="assets/js/util.js?v=3.0.0"></script>
  <script src="assets/js/icons.js?v=3.0.0"></script>
  <script src="assets/js/auth.js?v=3.0.0"></script>
  <script src="assets/js/rooms.js?v=3.0.0"></script>
  <script src="assets/js/resolver.js?v=3.0.0"></script>
  <script src="assets/js/room-cards.js?v=3.0.0"></script>
  <script src="assets/js/home.js?v=3.0.0"></script>
</body>
</html>
