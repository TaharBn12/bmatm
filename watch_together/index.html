  <meta name="twitter:description" content="اختر غرفة مشاهدة جماعية متزامنة أو أنشئ واحدة، وشاهد مع أصدقائك في نفس اللحظة مع دردشة مباشرة.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23c5a572'/%3E%3Cpath d='M40 32l28 18-28 18z' fill='%23141006'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Grand+Hotel&display=swap" rel="stylesheet">

</head>
<body class="home-page">
  <header class="home-header" aria-label="رأس الصفحة">
    <div class="home-header__inner">
      <a class="brand" href="index.html" aria-label="WatchTogether — الرئيسية">
        <span class="brand__logo"><span class="ic" data-icon="logo" data-size="22"></span></span>
        <span class="brand__text">
          <span class="brand__name">WatchTogether</span>
          <span class="brand__sub">WATCH • TOGETHER</span>
        </span>
      </a>
    </div>
  </header>

  <main class="home-main">
    <div class="home-heading">
      <div class="home-heading__left">
        <h1>غرف المشاهدة</h1>
        <span id="roomsCount" class="home-count">0</span>
      </div>
      <button class="btn btn--ghost btn--icon-sm" id="refreshRooms" type="button" aria-label="تحديث الغرف" title="تحديث الغرف">
        <span class="ic" data-icon="sync" data-size="18"></span>
      </button>
    </div>
    <p class="home-sub">اختر غرفة للانضمام، أو أنشئ واحدة جديدة للسهرة</p>
    <p class="home-status" id="homeStatus" role="status" hidden></p>
    <div class="room-grid" id="roomsList" aria-label="الغرف" aria-busy="true"></div>
    <div class="home-empty" id="roomsEmpty" role="status">
      <span class="ic" data-icon="film" data-size="34"></span>
      <span id="roomsEmptyText">جارٍ التحميل…</span>
    </div>
  </main>

  <nav class="home-bottom-nav" aria-label="التنقل الرئيسي">
    <a class="home-bottom-nav__link is-current" href="index.html" aria-current="page">
      <span class="ic" data-icon="home" data-size="21"></span><span>الغرف</span>
    </a>
    <a class="home-bottom-nav__link" href="profile.html">
      <span class="ic" data-icon="user" data-size="21"></span><span>ملفي</span>
    </a>
    <a class="home-bottom-nav__link" href="friends.html">
      <span class="ic" data-icon="users" data-size="21"></span><span>الأصدقاء</span>
    </a>
    <a class="home-bottom-nav__link" href="messages.html">
      <span class="ic" data-icon="chat" data-size="21"></span><span>الرسائل</span>
    </a>
  </nav>

  <section class="create-panel glass" id="creator" role="dialog" aria-labelledby="createHeading" hidden>
    <h2 id="createHeading">إضافة غرفة</h2>
    <form id="createForm" autocomplete="off" novalidate>
      <div>
        <label class="label" for="roomTitle">اسم الغرفة</label>
        <input class="input" id="roomTitle" type="text" maxlength="40" required>
      </div>
      <div>
        <label class="label" for="videoUrl">رابط الفيديو <span class="label__opt">(اختياري)</span></label>
        <input class="input input--ltr" id="videoUrl" type="url" inputmode="url" spellcheck="false" placeholder="https://…">
      </div>
      <p class="form-error" id="createError" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit" id="createBtn">
        <span class="ic" data-icon="plus" data-size="18"></span> إضافة الغرفة
      </button>
    </form>
  </section>

  <dialog class="room-action-dialog" id="roomActionDialog" aria-labelledby="roomActionTitle">
    <div id="roomActionContent"></div>
  </dialog>

  <button class="home-fab" id="createToggle" type="button" aria-label="إضافة غرفة" title="إضافة غرفة" aria-haspopup="dialog" aria-controls="creator" aria-expanded="false">
    <span id="createToggleIcon"><span class="ic" data-icon="plus" data-size="26"></span></span>
  </button>

  <script src="assets/js/config.js?v=3.2.0"></script>
  <script src="assets/js/util.js?v=3.1.0"></script>
  <script src="assets/js/icons.js?v=3.2.0"></script>
  <script src="assets/js/auth.js?v=3.2.0"></script>
  <script src="assets/js/rooms.js?v=3.1.0"></script>
  <script src="assets/js/resolver.js?v=3.0.0"></script>
  <script src="assets/js/room-cards.js?v=3.1.0"></script>
  <script src="assets/js/home.js?v=3.2.0"></script>
  <script src="assets/js/site.js?v=1.0.1"></script>
</body>
</html>
